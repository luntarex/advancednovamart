# ===== Server =====
server.port=8080

# ===== MySQL =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/novamart?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:NovaMartSecretKey2026SuperSecureLongEnoughForHS256Algorithm}
app.jwt.expiration-ms=3600000

# ===== Swagger / OpenAPI =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Stripe =====
stripe.api.key=${STRIPE_API_KEY:sk_test_51TQT941ua1s7B1SAwQtu3agPPMRIQMB5p07HGNFkmaCOlu72At09EtPuqgbqmzqidDY8pRORwUq4kT8qfBikRvBe002KCLPp9H}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
