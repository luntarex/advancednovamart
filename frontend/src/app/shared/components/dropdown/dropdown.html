<div class="dropdown-wrapper" [class.dropdown--open]="isOpen()">
  @if (label) {
    <label class="dropdown-label">{{ label }}</label>
  }

  <div class="dropdown-trigger" (click)="toggle()">
    <span class="selected-text" [class.placeholder]="!selectedLabel()">
      {{ selectedLabel() || placeholder }}
    </span>
    <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </div>

  @if (isOpen()) {
    <ul class="dropdown-list">
      @for (option of options; track option.value) {
        <li
          class="dropdown-item"
          [class.dropdown-item--active]="option.value === selectedValue()"
          (click)="select(option)"
        >
          {{ option.label }}
          @if (option.value === selectedValue()) {
            <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          }
        </li>
      }
    </ul>
  }
</div>
